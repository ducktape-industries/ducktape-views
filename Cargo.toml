# Rust-authored WASM views are loaded from files; GPUI renders their wire trees.
# A separate workspace keeps the WASM build profile independent of the desktop.
[workspace]
resolver = "2"
members = ["canvas", "governance", "home", "inbox", "members", "agents", "node", "explorer", "palette", "settings", "chat", "call", "files", "pages", "forge", "support/policy", "pages/tests/editor-binding-app"]

[workspace.dependencies]
futures = "0.3"
ducktape-view-guest = { package = "view-guest", git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "fb71df31ffed916d659fef0df81d792ccd21fdc8" }
design = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "fb71df31ffed916d659fef0df81d792ccd21fdc8", package = "design" }
view-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "fb71df31ffed916d659fef0df81d792ccd21fdc8", package = "view-wire" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
