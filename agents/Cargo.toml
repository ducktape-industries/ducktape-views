[package]
name = "agents-view"
version = "0.1.0"
edition = "2024"
publish = false

# A dynamically loaded WASM view; component exports require unsafe export names.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the view natively through the wire.

[dependencies]
duck-address = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duck-address" }
pages-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "pages-wire" }
refusal-class = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "refusal-class" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
ducktape-view-guest.workspace = true

[dev-dependencies]
# the snapshot tag is a digest of this view's own state layout; the tracer
# that derives it is host-only and never reaches the built component
view-wire = { workspace = true, features = ["schema"] }
runs-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "runs-wire" }
agent-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "agent-wire" }
