[package]
name = "ducktape-view-files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ducktape-view-guest.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
duckfs-core = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duckfs-core" }
# a file's `duck://<chain>/files/<path…>` address: files' typed tail over the
# one shared grammar, never a string built here
duck-address = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duck-address" }
