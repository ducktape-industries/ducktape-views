[package]
name = "pages-view"
version = "0.1.0"
edition = "2024"
publish = false

# Rust-authored declarative UI, dynamically loaded as a WASM component.
[lib]
crate-type = ["cdylib", "rlib"]
# Integration tests drive the guest directly through its wire contract.

[dependencies]
futures.workspace = true
pulldown-cmark = "0.12.2"
view-wire.workspace = true
# Shared document font families for Markdown presentation.
design.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
ducktape-view-guest.workspace = true
sha2 = "0.10"
unicode-normalization = "0.1"
# A page's `duck://<chain>/pages/<page>` address: pages' typed tail over the
# one shared grammar.
duck-address = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "duck-address" }

[dev-dependencies]
# the snapshot tag is a digest of this view's own state layout; the tracer
# that derives it is host-only and never reaches the built component
view-wire = { workspace = true, features = ["schema"] }
