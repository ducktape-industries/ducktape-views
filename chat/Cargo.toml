[package]
name = "chat-view"
version = "0.1.0"
edition = "2024"
publish = false

# A Rust-authored view, exported as a dynamically loaded WASM component by
# `export_view!`; `unsafe_code` is not forbidden only because the component
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducktape-view-guest.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
unicode-segmentation = "1"
