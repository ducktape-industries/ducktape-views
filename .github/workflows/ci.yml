name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # macOS runners are deliberately excluded; this CI is Linux-only.
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the channel and targets.
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --lib --no-fail-fast
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      # WASM view/component builds and ops/views-repro-check.sh are left to a later nightly.
